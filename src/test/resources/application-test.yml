spring:
  application:
    name: backend
  datasource:
    driver-class-name: ${SQL_DB_DRIVER:org.postgresql.Driver}
    url: jdbc:postgresql://${SQL_DB_URL:localhost}:${SQL_DB_PORT:5432}/memory
    username: ${SQL_DB_USERNAME:test}
    password: ${SQL_DB_PASSWORD:test}


  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        implicit_naming_strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
        hbm2ddl:
          auto: update


scryfall:
  url: http://localhost:${wiremock.server.port}